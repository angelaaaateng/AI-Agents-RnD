[project]
name = "ai-agents-rnd"
version = "0.1.0"
description = "AI Agents Research & Development - Experiments with LangChain, LangGraph, and intelligent agents"
requires-python = ">=3.12,<3.14"
dependencies = [
    "langchain>=1.1.3",
    "langchain-openai>=1.1.1",
    "python-dotenv>=1.0.0",
    "ipykernel>=7.1.0",
    "langchain-anthropic>=1.0.3",
    "langchain-tavily>=0.2.13",
    "tavily-python>=0.7.13",
    "langchain-community>=0.4.1",
    "langgraph>=1.0.3",
    "langgraph-cli>=0.4.9",
    "langsmith>=0.4.43",
    "langchain-core>=1.1.3",
    "jupyterlab>=4.5.1",
    "ipywidgets>=8.1.8",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["pet_gift_agent"]